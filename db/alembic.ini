# Alembic da base analítica. A URL vem de ACASO_DB_URL (veja migrations/env.py), nunca deste arquivo.
# Uso local:  ACASO_DB_URL=postgresql://acaso:acaso_local@localhost:5433/acaso .venv/bin/alembic -c db/alembic.ini upgrade head
# No compose, a carga aplica as migrations antes de gravar (etl/carga.py).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
