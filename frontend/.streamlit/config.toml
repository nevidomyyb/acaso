# Tema próprio (ADR-003), com a paleta da análise (analysis/estilo.py).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
font = "sans-serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false
